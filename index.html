<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Smythe&display=swap" rel="stylesheet">
       <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <header class="hero-section">
        <h1 class="hero-title">Jimmy's Diner</h1>
        <p class="hero-text">The best burgers and pizzas in town.</p>
        </header>
        <div class="container">
        <section id="menu"></section>
        <section id="order-container" class="order-container">
            <h3>Your Order</h3> 
            <div class= "orders" id="orders"></div>
            <div id="purchase"></div>
        </section>
        <form class="payment-details" id="payment-details">
            <h4>Enter payment details:</h4>
            <label for="full-name">Enter your full name</label>
            <input type="text" id="full-name" placeholder="James Bond" required>
            <label for="card-no">Enter card number</label>
            <input type="tel" id="card-no" pattern="[0-9\s]" maxlength="19" placeholder="xxxx xxxx xxxx xxxx" required>
            <label for="cvv">Enter CVV</label>
            <input type="tel" id="cvv" pattern="[0-9]" maxlength=3 placeholder="xxx" required>
            <button class="complete-order" type="submit">Pay</button>
        </form>
        </div>
	<script src="index.js" type="module"></script>
    </body>
</html>
